<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissor</title>
  </head>
  <body>
    <p>Rock Paper Scissors</p>
    <button onclick="gameMove('rock')">Rock</button>
    <button onclick="gameMove('paper')">Paper</button>
    <button onclick="gameMove('scissors')">Scissors</button>
    <button onclick="resetScore()">Reset Score</button>
    <script>
        function resetScore(){
            localStorage.removeItem('score');
        }
      function gameMove(playerMove) {
        const computerMove = getComputerMove();
        let result = "";
        let stringScore = localStorage.getItem('score');
        let score = JSON.parse(stringScore) || {
          win: 0,
          loose: 0,
          tie: 0,
        };
        console.log("playerMove="+playerMove);
        console.log("ComputerMove="+computerMove);
        console.log(score);
        if (playerMove == "rock") {
          if (computerMove == "rock") {
            result = "Tie";
          } else if (computerMove == "paper") {
            result = "You loose";
          } else if (computerMove == "scissors") {
            result = "You win";
          }
        }
        if (playerMove == "paper") {
          if (computerMove == "rock") {
            result = "You loose";
          } else if (computerMove == "paper") {
            result = "Tie";
          } else if (computerMove == "scissors") {
            result = "You win";
          }
        }
        if (playerMove == "scissors") {
          if (computerMove == "rock") {
            result = "You win";
          } else if (computerMove == "paper") {
            result = "You loose";
          } else if (computerMove == "scissors") {
            result = "Tie";
          }
        }

        if (result == "Tie") {
          score.tie += 1;
        } else if (result == "You win") {
          score.win += 1;
        } else if (result == "You loose") {
          score.loose += 1;
        }
        alert(`${result} Computer Move is ${computerMove}
          Score Board : Wins:${score.win} Looses:${score.loose} Ties: ${score.tie}
        `)
        localStorage.setItem('score',JSON.stringify(score));
      }
      function getComputerMove() {
        let computerMove;
        let num = Math.random();
        let message = "";
        if (num >= 0 && num <= 1 / 3) {
          computerMove = "rock";
        } else if (num > 1 / 3 && num <= 2 / 3) {
          computerMove = "paper";
        } else if (num > 2 / 3) {
          computerMove = "scissors";
        }
        return computerMove;
      }
    </script>
  </body>
</html>
